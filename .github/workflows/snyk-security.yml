name: Snyk Security Scan
on: push
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Snyk CLI
        run: npm install -g snyk
        
      - name: Run Snyk on sycro-web
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          cd apps/sycro-web
          snyk test --severity-threshold=high
