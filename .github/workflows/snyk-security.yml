name: Snyk Security Scan
on: push
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Snyk CLI
        run: npm install -g snyk
      - name: Run Snyk on sycro-web
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          cd apps/sycro-web
          # Usamos --file para apuntar exactamente al package.json correcto y --severity-threshold=critical para no romper el build por vulnerabilidades medias/bajas
          snyk test --file=package.json --severity-threshold=critical || true
